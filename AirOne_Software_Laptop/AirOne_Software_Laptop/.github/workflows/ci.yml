name: AirOne CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install optional ML dependencies for full detector coverage
        pip install scikit-learn torch --no-deps || echo "Optional ML packages skipped"
    
    - name: Set environment variables
      run: |
        echo "AIRONE_JWT_SECRET=CI_TEST_SECRET_32_CHARACTERS_LONG_12345678" >> $GITHUB_ENV
        echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV
        echo "AIRONE_ALLOW_DEFAULT_SECRET=true" >> $GITHUB_ENV
    
    - name: Run pytest
      run: |
        pytest -v --tb=short --color=yes
    
    - name: Probe detector availability
      run: |
        python3 -c "from src.ml import available_detectors; print('Available detectors:', available_detectors())"
    
    - name: Check import integrity (no circular deps)
      run: |
        python3 -c "import src.core.models; import src.api.app; import src.workers.orchestrator; print('✓ All core modules import cleanly')"
