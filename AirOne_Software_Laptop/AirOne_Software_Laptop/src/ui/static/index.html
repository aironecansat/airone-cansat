<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AirOne Ground Station</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#c9d1d9;--muted:#8b949e;--green:#3fb950;--red:#f85149;--amber:#d29922;--blue:#58a6ff;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;min-height:100vh;overflow:hidden;}
  header{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap;}
  .title{font-size:15px;font-weight:700;color:var(--blue);flex:1;white-space:nowrap;}
  .badge{padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;background:var(--border);color:var(--muted);white-space:nowrap;}
  .badge.ok{background:#1a3a20;color:var(--green);}.badge.err{background:#3a1a1a;color:var(--red);}.badge.warn{background:#3a2a0a;color:var(--amber);}
  #state-chip{padding:3px 14px;border-radius:20px;font-size:12px;font-weight:700;background:var(--border);color:var(--muted);letter-spacing:.04em;}
  #state-chip.BOOT{background:#1a2a3a;color:#58a6ff;}#state-chip.ASCENT{background:#1a3a20;color:#3fb950;}
  #state-chip.COAST{background:#2a3020;color:#b0d030;}#state-chip.DESCENT{background:#3a2a10;color:#e08010;}
  #state-chip.LANDED{background:#3a1020;color:#f85149;}
  main{display:grid;grid-template-columns:300px 1fr;grid-template-rows:auto 1fr 130px;gap:10px;padding:10px;height:calc(100vh - 46px);}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;}
  .ptitle{padding:7px 12px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);flex-shrink:0;}
  .pbody{padding:10px;overflow:auto;flex:1;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .stat{background:var(--bg);border-radius:6px;padding:8px 10px;}
  .slabel{font-size:11px;color:var(--muted);margin-bottom:3px;}
  .sval{font-size:20px;font-weight:700;}.sval.g{color:var(--green);}.sval.b{color:var(--blue);}.sval.a{color:var(--amber);}.sval.r{color:var(--red);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;padding:4px 6px;text-align:left;border-bottom:1px solid var(--border);}
  tr:nth-child(even){background:rgba(255,255,255,.02);}
  td{padding:4px 6px;}td.k{color:var(--muted);font-size:12px;}td.v{font-weight:600;}td.u{color:var(--muted);font-size:11px;}td.s{color:var(--muted);font-size:11px;}
  #no-signal{color:var(--amber);font-style:italic;font-size:12px;}
  #chart-panel{grid-column:2;grid-row:1/3;}
  canvas{width:100%!important;}
  #log-panel{grid-column:1/3;grid-row:3;}
  #log-body{font-family:monospace;font-size:12px;overflow-y:auto;max-height:100%;padding:6px 10px;}
  .ll{color:var(--muted);}.ll.new{color:var(--text);}
</style>
</head>
<body>
<header>
  <span class="title">&#128752; AirOne CanSat Ground Station</span>
  <span id="conn-badge" class="badge err">No signal</span>
  <span id="port-badge" class="badge">&#8212;</span>
  <span id="pkt-badge"  class="badge">0 pkts</span>
  <span id="fl-badge"   class="badge">Flights: 0/10</span>
  <span id="state-chip">IDLE</span>
</header>
<main>
  <div class="panel" style="grid-column:1;grid-row:1">
    <div class="ptitle">Link Status</div>
    <div class="pbody">
      <div class="stat-grid">
        <div class="stat"><div class="slabel">Packets Rx</div><div class="sval b" id="s-pkts">0</div></div>
        <div class="stat"><div class="slabel">Last packet</div><div class="sval" id="s-age">&#8212;</div></div>
        <div class="stat"><div class="slabel">Flights done</div><div class="sval g" id="s-fl">0</div></div>
        <div class="stat"><div class="slabel">Sim mode</div><div class="sval a" id="s-sim">Locked</div></div>
      </div>
    </div>
  </div>
  <div class="panel" style="grid-column:1;grid-row:2">
    <div class="ptitle">Sensor Readings</div>
    <div class="pbody">
      <p id="no-signal">Waiting for telemetry&hellip;</p>
      <table id="sensor-tbl" style="display:none">
        <thead><tr><th>Sensor</th><th>Value</th><th>Unit</th><th>Src</th></tr></thead>
        <tbody id="sensor-body"></tbody>
      </table>
    </div>
  </div>
  <div class="panel" id="chart-panel">
    <div class="ptitle">Altitude (m AGL) vs Time</div>
    <div class="pbody" style="position:relative"><canvas id="altChart"></canvas></div>
  </div>
  <div class="panel" id="log-panel">
    <div class="ptitle">Event Log</div>
    <div id="log-body"></div>
  </div>
</main>
<script>
const MAX_PTS=400;
const chartData={labels:[],datasets:[{label:'Altitude (m)',data:[],borderColor:'#58a6ff',backgroundColor:'rgba(88,166,255,.07)',fill:true,tension:.3,pointRadius:0,borderWidth:1.5}]};
const altChart=new Chart(document.getElementById('altChart'),{type:'line',data:chartData,options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8b949e',maxTicksLimit:8},grid:{color:'#21262d'}},y:{ticks:{color:'#8b949e'},grid:{color:'#21262d'},title:{display:true,text:'m AGL',color:'#8b949e'}}}}});
function pushAlt(ts,alt){const label=new Date(ts*1000).toLocaleTimeString();chartData.labels.push(label);chartData.datasets[0].data.push(alt);if(chartData.labels.length>MAX_PTS){chartData.labels.shift();chartData.datasets[0].data.shift();}altChart.update('none');}
const LABELS={temperature:'Temperature',pressure:'Pressure',humidity:'Humidity',altitude_rel:'Altitude (rel)',altitude_baro:'Altitude (baro)',accel_x:'Accel X',accel_y:'Accel Y',accel_z:'Accel Z',gyro_x:'Gyro X',gyro_y:'Gyro Y',gyro_z:'Gyro Z',mag_x:'Mag X',mag_y:'Mag Y',mag_z:'Mag Z',latitude:'Latitude',longitude:'Longitude',gps_altitude:'GPS Alt',battery_voltage:'Battery V',battery_current:'Battery I',battery_soc:'Battery %',mission_state:'Mission State',packet_sequence:'Sequence',uva:'UV-A',uvb:'UV-B',uv_index:'UV Index'};
function renderSensors(fields){const keys=Object.keys(fields);if(!keys.length)return;document.getElementById('no-signal').style.display='none';const tbl=document.getElementById('sensor-tbl');tbl.style.display='table';const tbody=document.getElementById('sensor-body');const existing={};for(const row of tbody.rows)existing[row.dataset.key]=row;keys.forEach(key=>{const raw=fields[key];let val,unit='',src='';if(raw!==null&&typeof raw==='object'&&'value' in raw){val=raw.value;unit=raw.unit||'';src=raw.source||'';}else{val=raw;}if(typeof val==='number')val=val.toFixed(3);let row=existing[key];if(!row){row=tbody.insertRow();row.dataset.key=key;row.insertCell().className='k';row.insertCell().className='v';row.insertCell().className='u';row.insertCell().className='s';}row.cells[0].textContent=LABELS[key]||key;row.cells[1].textContent=val;row.cells[2].textContent=unit;row.cells[3].textContent=src;});}
let lastTs=null,totalPkts=0;
function updateHeader(connected,port,pkts,flights){const cb=document.getElementById('conn-badge');cb.textContent=connected?'LIVE':'No signal';cb.className='badge '+(connected?'ok':'err');document.getElementById('port-badge').textContent=port||'—';document.getElementById('pkt-badge').textContent=pkts+' pkts';const fb=document.getElementById('fl-badge');fb.textContent='Flights: '+flights+'/10';fb.className='badge'+(flights>=10?' ok':'');document.getElementById('s-pkts').textContent=pkts;document.getElementById('s-fl').textContent=flights;const u=flights>=10;document.getElementById('s-sim').textContent=u?'Unlocked':'Locked ('+flights+'/10)';document.getElementById('s-sim').className='sval '+(u?'g':'a');}
function updateAge(){const el=document.getElementById('s-age');if(!lastTs){el.textContent='—';el.className='sval';return;}const age=((Date.now()/1000)-lastTs).toFixed(0);el.textContent=age+'s ago';el.className='sval '+(age<5?'g':age<15?'a':'r');}
setInterval(updateAge,1000);
function setStateChip(st){const chip=document.getElementById('state-chip');chip.textContent=st||'IDLE';const c=(st||'').toUpperCase();chip.className='';if(['BOOT','ASCENT','COAST','DESCENT','LANDED'].includes(c))chip.classList.add(c);}
function appendLog(lines){const body=document.getElementById('log-body');(Array.isArray(lines)?lines:[lines]).forEach(line=>{const el=document.createElement('div');el.className='ll new';el.textContent=line;body.appendChild(el);setTimeout(()=>el.classList.remove('new'),2500);});while(body.children.length>120)body.removeChild(body.firstChild);body.scrollTop=body.scrollHeight;}
function connect(){const es=new EventSource('/stream');es.onopen=()=>appendLog('[System] Stream connected');es.onerror=()=>{document.getElementById('conn-badge').textContent='Reconnecting…';document.getElementById('conn-badge').className='badge warn';};es.onmessage=e=>{let msg;try{msg=JSON.parse(e.data);}catch{return;}if(msg.type==='log'){appendLog(msg.line);return;}if(msg.type==='status'){updateHeader(msg.connected,msg.port,msg.packets_rx||0,msg.flights_completed||0);if(msg.log)appendLog(msg.log);return;}totalPkts=msg.packets_rx||totalPkts+1;lastTs=msg.ts;updateHeader(true,msg.port,totalPkts,msg.flights_completed||0);setStateChip(msg.mission_state);if(msg.fields){renderSensors(msg.fields);const af=msg.fields.altitude_rel||msg.fields.altitude_baro||msg.fields.gps_altitude;if(af!==undefined){const v=(af!==null&&typeof af==='object')?af.value:af;if(typeof v==='number')pushAlt(msg.ts,v);}}};}
connect();
</script>
</body>
</html>
