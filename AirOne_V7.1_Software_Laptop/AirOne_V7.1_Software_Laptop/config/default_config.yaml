# AirOne V7.1 default system configuration
# All values may be overridden via a custom config passed to launcher.py.

api:
  # Bind address. Default is loopback: the API speaks plain HTTP (no TLS).
  # To expose it on a LAN put a TLS reverse proxy in front, or set
  # AIRONE_API_HOST=0.0.0.0 explicitly (a warning is logged).
  host: "127.0.0.1"
  port: 5000
  # Maximum accepted request body (bytes). Larger bodies get HTTP 413.
  max_body_bytes: 262144
  # Exact browser origins allowed by CORS. "*" is refused unless
  # AIRONE_ALLOW_CORS_WILDCARD=1 is set.
  cors_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
  rate_limits:
    auth_login: "10 per minute"
    auth_refresh: "30 per minute"
    telemetry_export: "5 per minute"
    ml_train: "2 per hour"
    config: "20 per minute"

security:
  # JWT lifetimes (access tokens are short-lived; refresh tokens rotate).
  access_token_minutes: 15
  refresh_token_days: 7
  bcrypt_rounds: 12
  # Login throttling: per-account and per-source-IP failure limits within a
  # 15 minute window, exponential lockout starting at lockout_seconds.
  max_login_attempts: 5
  max_login_attempts_per_ip: 20
  lockout_seconds: 300
  # Secrets are NEVER stored here:
  #   AIRONE_JWT_SECRET       (required, >= 32 chars)
  #   AIRONE_ADMIN_PASSWORD   (only for `launcher.py --create-admin`)
  #   AIRONE_LINK_KEY         (optional hex key for telemetry frame tags)
  # No accounts ship with the software. Bootstrap: launcher.py --create-admin.
  # Demo accounts are seeded only when AIRONE_ALLOW_DEFAULT_USERS=1 (dev only).

telemetry:
  # Real CanSat link: LoRa E22 module on a USB-serial bridge (CP210x/CH340/FTDI).
  enabled: true              # false = do not start the live link (explicit)
  serial_port: null          # null = auto-discover known USB-serial bridges;
                             # or set e.g. "/dev/ttyUSB0" (Linux/macOS) / "COM5" (Windows)
  baud_rate: 115200          # must match the E22 UART baud (transparent mode)
  force_baud: false          # true = open directly at baud_rate, skip MAGIC
                             # negotiation (recommended for E22 transparent mode)
  buffer_size: 65536
  clock_drift_tolerance_ms: 5000
  # Frame authentication (truncated HMAC-SHA256 tag, FLAGS bit 0x08).
  # false = frames without a valid tag are accepted (SUSPECT when a key is
  #         configured, unverified when none is);
  # true  = requires AIRONE_LINK_KEY and marks every unauthenticated frame
  #         INVALID (never persisted as valid science data).
  require_authenticated_frames: false

pipeline:
  # Leave enabled_stages null to run all 20 stages.
  enabled_stages: null
  required_fields: []
  filter_config:
    fused_pressure:
      name: "kalman_1d"
      process_noise: 0.001
      measurement_noise: 0.1
    temperature:
      name: "moving_average"
      window: 5
    altitude:
      name: "ekf_altitude"
      process_noise: 0.01
      measurement_noise: 1.0

storage:
  db_path: "data/airone.db"
  data_dir: "data"
  backup_interval_hours: 6
  max_db_size_mb: 2048

mission:
  default_primary: "atmospheric_profiling"
  default_secondary: "uv_radiation_mapping"

logging:
  level: "INFO"
  log_dir: "logs"
  json_output: true
